name: Release overlay image

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: Existing production image tag used as the immutable base
        required: true
      release_tag:
        description: New immutable overlay image tag
        required: true
      release_revision:
        description: Main commit represented by the overlay
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Validate immutable release inputs
        env:
          BASE_TAG: ${{ inputs.base_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_REVISION: ${{ inputs.release_revision }}
        run: |
          [[ "$BASE_TAG" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^[0-9a-f]{40}-overlay$ ]]
          [[ "$RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" == "$RELEASE_REVISION-overlay" ]]
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish overlay
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.release-overlay
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/wfywfywfy01/vertu-data-hub:${{ inputs.base_tag }}
            RELEASE_REVISION=${{ inputs.release_revision }}
          tags: ghcr.io/wfywfywfy01/vertu-data-hub:${{ inputs.release_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
