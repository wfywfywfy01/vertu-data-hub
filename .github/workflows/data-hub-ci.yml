name: Data Hub CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: datahub
          POSTGRES_PASSWORD: datahub
          POSTGRES_DB: vertu_data_hub
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U datahub -d vertu_data_hub"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: development
      DATABASE_URL: postgresql://datahub:datahub@127.0.0.1:5434/vertu_data_hub
      SEMANTIC_IMAGE_PRELOAD: "false"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Scan tracked files for obvious secrets
        run: |
          if git grep -nI -E '(ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,})' HEAD -- ':!*.lock'; then
            echo "::error::Possible secret found in tracked files"
            exit 1
          fi
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m pip check
      - run: python scripts/init_db.py
      - run: python -m pytest -q
      - run: python -m compileall -q app scripts tests
      - run: docker compose config --quiet
      - name: Validate production Compose
        run: |
          cp .env.example .env
          docker compose -f docker-compose.production.yml config --quiet
          rm .env

  image:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: vertu-data-hub:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container and run smoke test
        run: |
          docker run --detach --rm --name data-hub-smoke \
            --env APP_ENV=development \
            --env API_HOST=0.0.0.0 \
            --env SEMANTIC_IMAGE_PRELOAD=false \
            --publish 127.0.0.1:8080:8080 \
            "vertu-data-hub:${{ github.sha }}"
          trap 'docker rm --force data-hub-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs data-hub-smoke
          exit 1
