services:
  api:
    image: ${DATA_HUB_IMAGE:?Set DATA_HUB_IMAGE to an image digest or commit tag}
    restart: unless-stopped
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8080
      HF_HOME: /models/huggingface
      TRANSFORMERS_OFFLINE: "1"
      DATA_HUB_IMAGE: ${DATA_HUB_IMAGE:?Set DATA_HUB_IMAGE to an image digest or commit tag}
      SERVICE_TOKEN_KEY_FILE: /run/secrets/dealer-knowledge-jwt.key
    ports:
      - "127.0.0.1:${DATA_HUB_PORT:-8080}:8080"
    volumes:
      - dealer_knowledge_secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 90s

  worker:
    image: ${DATA_HUB_IMAGE:?Set DATA_HUB_IMAGE to an image digest or commit tag}
    restart: unless-stopped
    env_file: .env
    environment:
      HF_HOME: /models/huggingface
      TRANSFORMERS_OFFLINE: "1"
      DATA_HUB_IMAGE: ${DATA_HUB_IMAGE:?Set DATA_HUB_IMAGE to an image digest or commit tag}
      SERVICE_TOKEN_KEY_FILE: /run/secrets/dealer-knowledge-jwt.key
    command: ["sh", "-c", "python -m app.cli.check_models && exec celery -A app.queue:celery_app worker -Q documents,images,videos --loglevel=INFO"]
    volumes:
      - dealer_knowledge_secrets:/run/secrets:ro

  backup:
    image: ${DATA_HUB_IMAGE:?Set DATA_HUB_IMAGE to an image digest or commit tag}
    profiles: ["ops"]
    env_file: .env
    environment:
      BACKUP_DIR: /backups
      BACKUP_RETENTION: ${DATA_HUB_BACKUP_RETENTION:-14}
    command: ["python", "scripts/backup_database.py"]
    volumes:
      - ${DATA_HUB_BACKUP_DIR_HOST:-./backups}:/backups

volumes:
  dealer_knowledge_secrets:
    external: true
    name: dealer-knowledge-secrets
