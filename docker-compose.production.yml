services:
  api:
    build: .
    image: ${DATA_HUB_IMAGE:-vertu-data-hub:local}
    restart: unless-stopped
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8080
      HF_HOME: /models/huggingface
      TRANSFORMERS_OFFLINE: "1"
      SERVICE_TOKEN_KEY_FILE: /run/secrets/dealer-knowledge-jwt.key
    ports:
      - "127.0.0.1:${DATA_HUB_PORT:-8080}:8080"
    volumes:
      - model_cache:/models/huggingface
      - ${DATA_HUB_SERVICE_TOKEN_KEY_FILE_HOST:-./secrets/dealer-knowledge-jwt.key}:/run/secrets/dealer-knowledge-jwt.key:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 90s

  worker:
    image: ${DATA_HUB_IMAGE:-vertu-data-hub:local}
    restart: unless-stopped
    env_file: .env
    environment:
      HF_HOME: /models/huggingface
      TRANSFORMERS_OFFLINE: "1"
      SERVICE_TOKEN_KEY_FILE: /run/secrets/dealer-knowledge-jwt.key
    command: ["celery", "-A", "app.queue:celery_app", "worker", "-Q", "documents,images,videos", "--loglevel=INFO"]
    volumes:
      - model_cache:/models/huggingface
      - ${DATA_HUB_SERVICE_TOKEN_KEY_FILE_HOST:-./secrets/dealer-knowledge-jwt.key}:/run/secrets/dealer-knowledge-jwt.key:ro

  backup:
    image: ${DATA_HUB_IMAGE:-vertu-data-hub:local}
    profiles: ["ops"]
    env_file: .env
    environment:
      BACKUP_DIR: /backups
      BACKUP_RETENTION: ${DATA_HUB_BACKUP_RETENTION:-14}
    command: ["python", "scripts/backup_database.py"]
    volumes:
      - ${DATA_HUB_BACKUP_DIR_HOST:-./backups}:/backups

volumes:
  model_cache:
