<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vertu 经销商知识库</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/ui/query.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="Vertu 经销商知识库">
      <span class="brand-mark">V</span>
      <div>
        <strong>VERTU</strong>
        <span>经销商知识库</span>
      </div>
    </div>
    <div class="system-state" role="status">
      <span class="status-dot" aria-hidden="true"></span>
      本地试点环境
    </div>
  </header>

  <main>
    <aside class="sidebar" aria-label="检索范围">
      <div class="sidebar-heading">
        <p>知识范围</p>
        <h1>经销商资料查询</h1>
      </div>

      <div class="field">
        <label for="dealer">经销商</label>
        <select id="dealer" disabled>
          <option>正在载入...</option>
        </select>
        <p id="dealer-meta" class="field-meta">连接经销商主表</p>
      </div>

      <div class="field">
        <label for="category">资料分类</label>
        <select id="category">
          <option value="">全部资料</option>
          <option value="dealer_profile">经销商档案</option>
          <option value="contract_compliance">合同与合规</option>
          <option value="store_display">门店陈列</option>
          <option value="product_policy">产品与政策</option>
          <option value="sales_inventory">销售与库存</option>
          <option value="marketing_training">市场与培训</option>
          <option value="communications">沟通记录</option>
          <option value="logistics_after_sales">物流与售后</option>
          <option value="finance_settlement">财务结算</option>
          <option value="media">图片与媒体</option>
        </select>
      </div>

      <div class="privacy-note">
        <strong>数据保护</strong>
        <p>检索结果已脱敏。当前页面仅允许本机访问，查询操作写入审计记录。</p>
      </div>
    </aside>

    <section class="workspace" aria-labelledby="workspace-title">
      <div class="workspace-heading">
        <div>
          <p class="eyebrow">KNOWLEDGE RETRIEVAL</p>
          <h2 id="workspace-title">从经销商资料中查找证据</h2>
        </div>
        <a href="/docs" class="api-link">API 文档</a>
      </div>

      <form id="search-form" class="search-form">
        <label for="query" class="sr-only">输入查询问题</label>
        <input
          id="query"
          type="search"
          maxlength="500"
          autocomplete="off"
          placeholder="例如：VMG 胡志明发布会有哪些现场资料？"
          required
        >
        <button id="search-button" type="submit" disabled>查询</button>
      </form>

      <div id="notice" class="notice" role="status" aria-live="polite">
        选择经销商并输入问题，结果会附带原始文件引用。
      </div>

      <section id="results-section" class="results-section" aria-labelledby="results-title" hidden>
        <div class="results-heading">
          <h3 id="results-title">检索结果</h3>
          <span id="result-count"></span>
        </div>
        <ol id="results" class="results-list"></ol>
      </section>
    </section>
  </main>

  <template id="result-template">
    <li class="result-item">
      <div class="result-index" aria-hidden="true"></div>
      <a class="result-preview" target="_blank" rel="noopener noreferrer">
        <img class="result-image" loading="lazy" decoding="async" alt="">
        <span>查看原图</span>
      </a>
      <article>
        <div class="result-topline">
          <h4 class="result-title"></h4>
          <span class="result-score"></span>
        </div>
        <p class="result-text"></p>
        <div class="result-caption" hidden>
          <strong>社媒配文草稿</strong>
          <p></p>
          <span>发布前请人工确认</span>
        </div>
        <dl class="citation">
          <div><dt>文件</dt><dd class="citation-file"></dd></div>
          <div><dt>版本</dt><dd class="citation-version"></dd></div>
          <div><dt>分类</dt><dd class="citation-category"></dd></div>
          <div><dt>敏感级别</dt><dd class="citation-sensitivity"></dd></div>
        </dl>
      </article>
    </li>
  </template>

  <script src="/ui/query.js" defer></script>
</body>
</html>
